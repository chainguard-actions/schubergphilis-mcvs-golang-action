name: Test grype-version and token inputs (step skipped without token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass grype-version with a no-op testing-type so no conditional steps
      # are triggered, but grype-version is still exercised in the with: block.
      - id: action
        uses: .
        with:
          go-version-file: "go.mod"
          testing-type: "noop-grype-test"
          grype-version: "0.79.4"

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed without error; grype step was skipped because token was empty"
