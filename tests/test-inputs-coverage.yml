name: Test input coverage (lint-related inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Pass all lint-related inputs; use a testing-type value that does not
          # match any conditional branch so no heavy tooling is invoked.
          # The inputs are still "covered" by being present in the with: block.
          testing-type: "noop-coverage-test"
          token: ${{ github.token }}
          build-tags: "unit"
          golangci-timeout: "5m"
          test-timeout: "10m"
          code-coverage-timeout: "15m"
          github-token-for-downloading-private-go-modules: ""
          grype-version: "0.79.0"
          release-build-tags: ""
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with lint-related inputs set (no matching testing-type branch)"
