name: Test security-grype testing type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with security-grype testing type
        id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "security-grype"
          token: ${{ github.token }}
          grype-version: "0.88.0"
          # These inputs are included for coverage even though they apply to other testing-types
          build-tags: "integration"
          golangci-timeout: "5m"
          code-coverage-timeout: "5m"
          test-timeout: "5m"
          go-version-file: "tests/fixtures/app/go.mod"
      - name: Assert action ran (grype scan may fail on sentinel repo path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: security-grype scan completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
