name: Test security-grype testing-type with grype-version and token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: security-grype
          grype-version: v0.88.0
          token: ${{ github.token }}
          go-version-file: tests/fixtures/simple-app/go.mod
      - name: Assert action ran with security-grype inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The security-grype testing-type runs anchore/scan-action with grype.
          # It requires token != '' to activate. The scan may succeed or fail
          # depending on vulnerabilities found, but the action must not crash
          # unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: security-grype action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — grype scan may find issues or setup may fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
