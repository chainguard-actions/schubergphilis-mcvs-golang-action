name: Test release build tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-dir: tests/fixtures/simple-app
          release-application-name: simple-app-tagged
          release-architecture: amd64
          release-os: linux
          release-type: binary
          release-build-tags: "integration"
          go-version-file: tests/fixtures/simple-app/go.mod
      - name: Assert binary built with build tags or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "asset_name: $ASSET_NAME"
          BINARY_PATH="$GITHUB_WORKSPACE/build/binary/simple-app-tagged/amd64/main"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "$BINARY_PATH" ]; then
              echo "FAIL: action succeeded but binary not found at $BINARY_PATH"
              exit 1
            fi
            echo "Binary file info:"
            file "$BINARY_PATH"
            if [ -z "$ASSET_NAME" ]; then
              echo "FAIL: action succeeded but asset_name output is empty"
              exit 1
            fi
            if ! echo "$ASSET_NAME" | grep -q "integration"; then
              echo "FAIL: asset_name does not contain build tag 'integration': $ASSET_NAME"
              exit 1
            fi
            echo "PASS: binary built with build tags, asset_name='$ASSET_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (go build with build tags may fail in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
