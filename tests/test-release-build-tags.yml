name: Test release build with build tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with release-build-tags
        id: action
        uses: .
        with:
          release-dir: tests/fixtures/app
          release-application-name: test-app-tagged
          release-architecture: amd64
          release-os: linux
          release-type: binary
          release-build-tags: integration
          token: ${{ github.token }}
          go-version-file: tests/fixtures/app/go.mod
      - name: Assert binary was built with build tags
        run: |
          BINARY_PATH="build/binary/test-app-tagged/amd64/main"
          echo "Checking for binary at: ${BINARY_PATH}"
          if [ ! -f "${BINARY_PATH}" ]; then
            echo "FAIL: expected binary not found at ${BINARY_PATH}"
            ls -la build/ 2>/dev/null || echo "(build/ does not exist)"
            exit 1
          fi
          echo "Binary found. Checking it is executable..."
          if [ ! -x "${BINARY_PATH}" ]; then
            echo "FAIL: binary is not executable"
            exit 1
          fi
          echo "PASS: binary built with build tags"
      - name: Assert asset name includes build tags
        env:
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
        run: |
          echo "asset_name: ${ASSET_NAME}"
          if [ -z "${ASSET_NAME}" ]; then
            echo "FAIL: asset_name output is empty"
            exit 1
          fi
          if echo "${ASSET_NAME}" | grep -q "integration"; then
            echo "PASS: asset_name contains build tag 'integration'"
          else
            echo "FAIL: asset_name does not contain build tag 'integration': ${ASSET_NAME}"
            exit 1
          fi
