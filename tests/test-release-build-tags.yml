name: Test release-build-tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-dir: "tests/fixtures/goproject/cmd/hello"
          release-application-name: "hello"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          release-build-tags: "lambda.norpc"
          go-version-file: "tests/fixtures/go.mod"
      - name: Assert action ran with release-build-tags input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "asset_name: $ASSET_NAME"
          if [ "$OUTCOME" = "success" ]; then
            # When release-build-tags is set, the asset name should include the tag
            if [ -z "$ASSET_NAME" ]; then
              echo "FAIL: action succeeded but asset_name output is empty"
              exit 1
            fi
            if echo "$ASSET_NAME" | grep -q "lambda.norpc"; then
              echo "PASS: asset_name contains release-build-tags value: $ASSET_NAME"
            else
              echo "FAIL: asset_name does not contain 'lambda.norpc': $ASSET_NAME"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness without a full Go project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
