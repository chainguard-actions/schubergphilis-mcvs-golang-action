name: Test release-build-tags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up minimal Go project for release build with tags
        run: |
          # Create a minimal Go project so the action can run go mod tidy and
          # go build with build tags.
          cat > "$GITHUB_WORKSPACE/go.mod" << 'EOF'
          module github.com/test/release-app

          go 1.21
          EOF
          mkdir -p "$GITHUB_WORKSPACE/cmd/tagapp"
          cat > "$GITHUB_WORKSPACE/cmd/tagapp/main.go" << 'EOF'
          package main

          import "fmt"

          func main() {
            fmt.Println("Hello with build tags!")
          }
          EOF
      - name: Run action with release-build-tags input
        id: action
        uses: .
        continue-on-error: true
        with:
          release-dir: cmd/tagapp
          release-application-name: tagapp
          release-architecture: amd64
          release-type: binary
          release-os: linux
          release-build-tags: lambda.norpc
          go-version-file: go.mod
          token: ${{ github.token }}
      - name: Assert action ran with release-build-tags input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release build with build tags completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
