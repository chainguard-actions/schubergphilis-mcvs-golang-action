name: Test timeout inputs (code-coverage-timeout and test-timeout)
on:
  workflow_dispatch:
jobs:
  test-coverage-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          code-coverage-timeout: "10m"
          code-coverage-expected: "80"
          # go-version-file defaults to go.mod which exists in the action repo root
      - name: Assert action ran with code-coverage-timeout input accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: coverage failed gracefully (expected on harness repo without test suite)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

  test-test-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "integration"
          test-timeout: "5m"
          # go-version-file defaults to go.mod which exists in the action repo root
      - name: Assert action ran with test-timeout input accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: integration tests succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: integration tests failed gracefully (expected on harness repo without integration test suite)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
