name: Test release inputs without release-dir skip build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          release-dir: ""
          release-application-name: myapp
          release-architecture: amd64
          release-build-tags: lambda.norpc
          release-type: binary
          release-os: linux
      - name: Assert no build or release happened
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/build/binary/myapp" ]; then
            echo "FAIL: build directory should not have been created without release-dir"
            exit 1
          fi
          echo "PASS"
