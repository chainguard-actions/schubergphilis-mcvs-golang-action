name: Test code-coverage-timeout and test-timeout inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass code-coverage-timeout and test-timeout with a no-op testing-type
      # so no conditional steps are triggered, but the inputs are exercised
      # in the with: block for coverage purposes.
      - id: action
        uses: .
        with:
          go-version-file: "go.mod"
          testing-type: "noop-timeout-test"
          code-coverage-timeout: "10m"
          test-timeout: "5m"

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed; timeout inputs were passed and no steps were triggered"
