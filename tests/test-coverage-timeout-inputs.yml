name: Test coverage and timeout inputs (code-coverage-timeout, test-timeout, testing-type)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: coverage
          code-coverage-timeout: "5m"
          test-timeout: "10m"
          token: ${{ github.token }}
          go-version-file: tests/fixtures/simple-app/go.mod
      - name: Assert action ran with coverage timeout inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The coverage testing-type runs task remote:coverage --yes.
          # This will fail in the harness because there is no Taskfile,
          # but the action must have at least started (not a setup failure).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with coverage timeout inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no Taskfile in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
