name: Test coverage and test-timeout inputs (code-coverage-timeout, test-timeout, testing-type)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake task binary matching expected version
        run: |
          # Create a fake task binary so the action's version check passes
          # and it skips the go install step (avoiding network dependency)
          printf '#!/bin/sh\necho "Task version: v3.51.1"\n' > /usr/local/bin/task
          chmod +x /usr/local/bin/task
          echo "Fake task installed: $(task --version)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "go.mod"
          testing-type: "coverage"
          token: ${{ github.token }}
          code-coverage-timeout: "10m"
          code-coverage-expected: "80"
      - name: Assert action ran (coverage with code-coverage-timeout)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because task remote:coverage is not
          # available in this test environment, but it must have run (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with testing-type=coverage and code-coverage-timeout input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have been skipped"
            exit 1
          fi
  test-integration-timeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake task binary matching expected version
        run: |
          printf '#!/bin/sh\necho "Task version: v3.51.1"\n' > /usr/local/bin/task
          chmod +x /usr/local/bin/task
          echo "Fake task installed: $(task --version)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "go.mod"
          testing-type: "integration"
          token: ${{ github.token }}
          test-timeout: "30m"
      - name: Assert action ran (integration with test-timeout)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because task remote:test-integration-cicd is not
          # available in this test environment, but it must have run (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with testing-type=integration and test-timeout input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have been skipped"
            exit 1
          fi
