name: Test security-grype with grype-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "security-grype"
          grype-version: "0.88.0"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert grype scan with version ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: grype scan with specified version completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: grype scan ran but failed gracefully (vulnerabilities found or harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
