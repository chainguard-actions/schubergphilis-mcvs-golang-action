name: Test integration with test-timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "integration"
          test-timeout: "30m"
          token: ${{ github.token }}
          # testing-type=integration triggers: setup-go, install-task, go-mod-tidy,
          # integration tests. The integration step runs 'task remote:test-integration-cicd
          # --yes' which will fail without a full project setup, but we verify the inputs
          # were accepted.
      - name: Assert action ran with test-timeout input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: integration tests completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: integration tests failed gracefully (expected without full project setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
