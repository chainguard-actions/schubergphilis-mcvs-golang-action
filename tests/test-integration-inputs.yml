name: Test integration inputs (test-timeout, testing-type, token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "integration"
          test-timeout: "30m"
          token: ${{ github.token }}
          go-version-file: "tests/fixtures/go.mod"
      - name: Assert action ran with integration inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The integration testing-type runs task remote:test-integration-cicd
          # which requires a full Go project with integration tests. Under the
          # act harness this will fail because the remote task is not available,
          # but the action must not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with integration inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act harness for integration)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
