name: Test github-token-for-downloading-private-go-modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          task-install: "yes"
          task-version: "3.53.1"
          go-version-file: "tests/fixtures/release-app/go.mod"
          github-token-for-downloading-private-go-modules: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert private modules token step ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action with private modules token completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
