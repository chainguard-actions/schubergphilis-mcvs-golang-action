name: Test github-token-for-downloading-private-go-modules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version-file: "go.mod"
          release-dir: "tests/fixtures/cmd/hello"
          release-application-name: "hello"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert git config was set for private modules
        run: |
          echo "Checking git config for private module URL rewrite..."
          GIT_CONFIG=$(git config --global --get-regexp "url\." 2>/dev/null || true)
          echo "git config url entries: $GIT_CONFIG"
          if echo "$GIT_CONFIG" | grep -q "github.com"; then
            echo "PASS: git config URL rewrite for github.com is set"
          else
            echo "FAIL: git config URL rewrite for github.com was not set"
            exit 1
          fi
      - name: Assert binary was built
        run: |
          BINARY_PATH="build/binary/hello/amd64/main"
          echo "Checking for binary at: $BINARY_PATH"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "FAIL: binary not found at $BINARY_PATH"
            find build/ -type f 2>/dev/null || echo "build/ directory not found"
            exit 1
          fi
          echo "PASS: binary exists at $BINARY_PATH"
