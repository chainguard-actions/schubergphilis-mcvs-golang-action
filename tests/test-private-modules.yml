name: Test github-token-for-downloading-private-go-modules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with github-token-for-downloading-private-go-modules
        id: action
        uses: .
        with:
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert git config was set for private modules
        run: |
          echo "Checking git config for private module token..."
          GIT_CONFIG=$(git config --global --get-regexp "url.*insteadOf" 2>/dev/null || true)
          echo "git config url insteadOf: $GIT_CONFIG"
          if echo "$GIT_CONFIG" | grep -q "github.com"; then
            echo "PASS: git config for private modules is set"
          else
            echo "FAIL: git config for private modules was not set"
            exit 1
          fi
