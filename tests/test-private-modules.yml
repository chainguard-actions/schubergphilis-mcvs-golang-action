name: Test private modules (github-token-for-downloading-private-go-modules input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Providing this input triggers the git config URL rewriting step.
          # We use the real github token so the git config command succeeds.
          github-token-for-downloading-private-go-modules: ${{ github.token }}
          go-version-file: "tests/fixtures/go-project/go.mod"
      - name: Assert action ran with private modules token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The git config step should succeed (it just sets a URL rewrite rule).
          # No testing-type is set, so all other steps are skipped.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected success or failure"
            exit 1
          fi
