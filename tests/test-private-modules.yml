name: Test private Go modules token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide a token so the git config step runs; no testing-type means
          # all other conditional steps are skipped — this is a no-op scenario
          # that exercises the github-token-for-downloading-private-go-modules path.
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert action ran (private modules git config step exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with private modules token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
