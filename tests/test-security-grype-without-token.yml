name: Test security-grype without token skips scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          testing-type: security-grype
      - name: Assert action succeeded and no scan ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ls results.sarif 2>/dev/null; then
            echo "FAIL: grype output should not exist when token is empty"
            exit 1
          fi
          echo "PASS"
