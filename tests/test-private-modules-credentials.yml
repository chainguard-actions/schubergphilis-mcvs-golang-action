name: Test git credentials for private go modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert git credential helper configured
        run: |
          helper="$(git config --global --get credential.https://github.com.helper || true)"
          echo "helper: $helper"
          if [ "$helper" != "store" ]; then
            echo "FAIL: expected credential helper 'store'"
            exit 1
          fi
          auth="$(git config --global --get http.https://github.com/.proactiveAuth || true)"
          echo "proactiveAuth: $auth"
          if [ "$auth" != "basic" ]; then
            echo "FAIL: expected proactiveAuth 'basic'"
            exit 1
          fi
          echo "PASS"
      - name: Assert credentials stored
        run: |
          f="$HOME/.git-credentials"
          if [ ! -f "$f" ]; then
            echo "FAIL: $f not found"
            exit 1
          fi
          if ! grep -q '^https://x-access-token:.*@github.com' "$f"; then
            echo "FAIL: x-access-token credential for github.com not stored"
            sed -E 's#://([^:]*):[^@]*@#://\1:***@#' "$f"
            exit 1
          fi
          echo "PASS"
