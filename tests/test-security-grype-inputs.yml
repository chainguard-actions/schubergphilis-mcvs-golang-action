name: Test security-grype inputs (grype-version, token, testing-type)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "security-grype"
          token: ${{ github.token }}
          grype-version: "0.88.0"
      - name: Assert action ran (security-grype with grype-version and token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed or fail depending on grype scan results,
          # but it must have run (not skipped) with the provided inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with testing-type=security-grype, grype-version, and token inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have been skipped"
            exit 1
          fi
