name: Test security grype inputs (testing-type=security-grype, grype-version, token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "security-grype"
          token: ${{ github.token }}
          grype-version: "0.88.0"
      - name: Assert action ran with security-grype inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action runs anchore/scan-action with grype.
          # Under the harness this may fail due to the sentinel repo or
          # network constraints, but the important thing is that the action
          # accepted all the inputs and ran (did not fail at startup).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with security-grype inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
