name: Test testing-type lint (with build-tags, golangci-timeout, token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake task binary to avoid network dependency
        run: |
          # Fake task that succeeds for any remote:* command
          cat > /usr/local/bin/task << 'EOF'
          #!/bin/sh
          echo "Task version: v3.53.1"
          case "$*" in
            *golangci-lint*) echo "golangci-lint: no issues found (fake)" ;;
            *) echo "task: $*" ;;
          esac
          exit 0
          EOF
          chmod +x /usr/local/bin/task
          echo "Fake task installed"
          task --version
      - name: Align go.mod version with installed Go to allow go mod tidy to succeed
        run: |
          # The action runs 'go mod tidy' in the workspace root.
          # Update go.mod to use go 1.21.0 so it matches the Go version we install.
          sed -i 's/^go [0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?$/go 1.21.0/' go.mod
          echo "Updated go.mod:"
          cat go.mod
          # Stage the change so git diff --exit-code passes after go mod tidy
          git config user.email "test@example.com"
          git config user.name "Test"
          git add go.mod
          git commit -m "test: align go version for lint test" --allow-empty
      - name: Run action with testing-type=lint
        id: action
        uses: .
        with:
          testing-type: "lint"
          token: ${{ github.token }}
          build-tags: "component"
          golangci-timeout: "5m"
          go-version-file: "tests/fixtures/goapp/go.mod"
      - name: Assert action completed
        run: |
          echo "PASS: action completed with testing-type=lint, build-tags, golangci-timeout, and token inputs"
