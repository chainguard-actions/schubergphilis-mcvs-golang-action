name: Test testing-type lint (covers build-tags, golangci-timeout, token inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "go.mod"
          testing-type: "lint"
          token: ${{ github.token }}
          build-tags: "integration"
          golangci-timeout: "5m"
      - name: Assert action ran (lint attempted, may fail due to missing taskfile)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: lint completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in harness - task remote:golangci-lint requires external taskfile)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
