name: Test lint testing-type (covers build-tags, golangci-timeout, token inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "lint"
          build-tags: "unit"
          golangci-timeout: "5m"
          token: ${{ github.token }}
          go-version-file: "tests/fixtures/go-app/go.mod"
      - name: Assert action ran (lint may fail without a real project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: lint completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without a real Go project to lint)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
