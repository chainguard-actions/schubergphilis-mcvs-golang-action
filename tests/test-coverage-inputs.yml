name: Test coverage inputs (code-coverage-timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Pass code-coverage-timeout without triggering coverage testing
          # (no testing-type set, so all conditional steps are skipped)
          code-coverage-timeout: "10m"
          code-coverage-expected: "80"
      - name: Assert action completed without error
        run: |
          echo "PASS: action completed successfully with code-coverage-timeout input set"
