name: Test coverage testing-type with related inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          token: ${{ github.token }}
          code-coverage-expected: "80"
          code-coverage-timeout: "10m"
          test-timeout: "5m"
          go-version-file: "tests/fixtures/hello/go.mod"
      - name: Assert action ran with coverage inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with testing-type=coverage"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness — no real Go project for coverage)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
