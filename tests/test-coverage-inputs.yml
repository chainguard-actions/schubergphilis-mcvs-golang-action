name: Test coverage inputs (testing-type=coverage, code-coverage-timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          token: ${{ github.token }}
          code-coverage-expected: "80"
          code-coverage-timeout: "5m"
          go-version-file: "tests/fixtures/go.mod"
      - name: Assert action ran with coverage inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action runs task remote:coverage --yes.
          # Under the harness this will likely fail because there is no real
          # Go project with tests, but the important thing is that the action
          # accepted all the inputs and ran (did not fail at startup).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with coverage inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness without a full Go project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
