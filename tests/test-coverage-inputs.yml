name: Test coverage inputs (code-coverage-timeout, testing-type, token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          code-coverage-timeout: "10m"
          code-coverage-expected: "80"
          token: ${{ github.token }}
          go-version-file: "tests/fixtures/go.mod"
      - name: Assert action ran with coverage inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The coverage testing-type runs task remote:coverage which requires
          # a full Go project with tests. Under the act harness this will fail
          # because the remote task is not available or the project has no tests,
          # but the action must not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with coverage inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under act harness for coverage)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
