name: Test coverage inputs (code-coverage-timeout, testing-type coverage)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: coverage
          code-coverage-expected: "80"
          code-coverage-timeout: "5m"
          token: ${{ github.token }}
          go-version-file: tests/fixtures/simple-app/go.mod
      - name: Assert action ran with coverage inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with coverage inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (task remote:coverage requires a full project setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
