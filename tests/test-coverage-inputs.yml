name: Test coverage inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          token: ${{ github.token }}
          code-coverage-expected: "80"
          code-coverage-timeout: "5m"
          go-version-file: "go.mod"
      - name: Assert action ran (coverage step attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The coverage testing-type runs task remote:coverage.
          # Under the harness, the Taskfile may not have the remote task defined,
          # so the action may fail. Either outcome is acceptable as long as the
          # action ran (not skipped).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without full Taskfile setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
