name: Test security-golang-modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace go.mod for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          if [ -f go.mod ]; then
            # If go.mod has a future/invalid go version, downgrade it so go mod verify works
            if grep -qE '^go [2-9]\.|^go 1\.[2-9][0-9]' go.mod; then
              sed -i 's/^go .*/go 1.21.0/' go.mod
              git add go.mod
            fi
          else
            printf 'module github.com/test/workspace\n\ngo 1.21.0\n' > go.mod
            git add go.mod
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "security-golang-modules"
          task-version: "3.53.1"
          go-version-file: "tests/fixtures/release-app/go.mod"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert security-golang-modules ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: security-golang-modules completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: security-golang-modules ran but failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
