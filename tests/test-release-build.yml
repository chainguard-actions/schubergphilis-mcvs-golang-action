name: Test release build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake task binary to avoid network dependency
        run: |
          cat > /usr/local/bin/task << 'TASKEOF'
#!/bin/sh
echo "Task version: v3.53.1"
TASKEOF
          chmod +x /usr/local/bin/task
          echo "Fake task installed:"
          task --version
      - name: Set up Go workspace with a minimal module at repo root
        run: |
          # Create a minimal go.mod at workspace root so go mod tidy succeeds.
          # The file is untracked, so git diff --exit-code will not flag it.
          printf 'module github.com/test/release-test\n\ngo 1.21.0\n' > "$GITHUB_WORKSPACE/go.mod"
          # Create main.go at workspace root for the release build
          printf 'package main\n\nimport "fmt"\n\nfunc main() {\n\tfmt.Println("hello from release binary")\n}\n' > "$GITHUB_WORKSPACE/main.go"
          echo "Created go.mod:"
          cat "$GITHUB_WORKSPACE/go.mod"
          echo "Created main.go:"
          cat "$GITHUB_WORKSPACE/main.go"
      - name: Run action to build a release binary
        id: action
        uses: .
        with:
          go-version-file: "go.mod"
          release-dir: "."
          release-application-name: "myapp"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          token: ""
      - name: Assert binary was built
        run: |
          BINARY_PATH="$GITHUB_WORKSPACE/build/binary/myapp/amd64/main"
          echo "Checking for binary at: $BINARY_PATH"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "FAIL: expected binary not found at $BINARY_PATH"
            ls -la "$GITHUB_WORKSPACE/build/" 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi
          echo "Binary found. Running it..."
          OUTPUT=$("$BINARY_PATH" 2>&1 || true)
          echo "Binary output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: binary produced no output"
            exit 1
          fi
          echo "PASS: binary built and executed successfully"
      - name: Assert asset name output is set
        env:
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
        run: |
          echo "asset_name: $ASSET_NAME"
          if [ -z "$ASSET_NAME" ]; then
            echo "FAIL: asset_name output is empty"
            exit 1
          fi
          echo "PASS: asset_name is '$ASSET_NAME'"
