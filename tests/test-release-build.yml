name: Test release build scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action to build a release binary
        id: action
        uses: .
        with:
          release-dir: "tests/fixtures/app"
          release-application-name: "test-app"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          release-build-tags: "integration"
          go-version-file: "tests/fixtures/app/go.mod"
      - name: Assert binary was built
        run: |
          echo "Checking that the binary was built..."
          BINARY_PATH="build/binary/test-app/amd64/main"
          if [ -f "$BINARY_PATH" ]; then
            echo "PASS: binary found at $BINARY_PATH"
            ls -la "$BINARY_PATH"
          else
            echo "FAIL: binary not found at $BINARY_PATH"
            echo "Contents of build directory (if it exists):"
            find build/ -type f 2>/dev/null || echo "(build directory does not exist)"
            exit 1
          fi
