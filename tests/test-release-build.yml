name: Test release build inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-dir: "hardened/tests/fixtures/cmd"
          release-application-name: "testapp"
          release-architecture: "amd64"
          release-type: "binary"
          release-build-tags: "integration"
          release-os: "linux"
          token: ${{ github.token }}
          # release-dir != '' triggers: setup-go, install-task, go-mod-tidy, build binary,
          # compute asset name. The build uses the fixture main.go.
          # go-mod-tidy runs in workspace root (action's go.mod), then build uses fixture.
          # May fail due to module mismatch; assert on outcome.
      - name: Assert release build ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release build completed successfully"
            # Verify the binary was created
            BUILD_PATH="build/binary/testapp/amd64/main"
            if [ -f "$BUILD_PATH" ]; then
              echo "PASS: binary found at $BUILD_PATH"
            else
              echo "INFO: binary not found at $BUILD_PATH (may be in different location)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: release build failed gracefully (expected without matching go.mod)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
