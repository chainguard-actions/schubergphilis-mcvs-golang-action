name: Test git credentials for private go modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert git credentials configured
        run: |
          helper="$(git config --global --get credential.https://github.com.helper || true)"
          auth="$(git config --global --get http.https://github.com/.proactiveAuth || true)"
          echo "helper: $helper"
          echo "proactiveAuth: $auth"
          if [ "$helper" != "store" ]; then
            echo "FAIL: expected credential helper 'store'"
            exit 1
          fi
          if [ "$auth" != "basic" ]; then
            echo "FAIL: expected proactiveAuth 'basic'"
            exit 1
          fi
          if ! grep -q "x-access-token" "$HOME/.git-credentials"; then
            echo "FAIL: ~/.git-credentials missing x-access-token entry"
            exit 1
          fi
          if ! grep -q "github.com" "$HOME/.git-credentials"; then
            echo "FAIL: ~/.git-credentials missing github.com entry"
            exit 1
          fi
          echo "PASS"
