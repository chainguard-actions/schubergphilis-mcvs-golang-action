name: Test private go modules credential configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert git credentials configured
        run: |
          helper="$(git config --global --get credential.https://github.com.helper || true)"
          auth="$(git config --global --get http.https://github.com/.proactiveAuth || true)"
          echo "helper: '$helper'"
          echo "proactiveAuth: '$auth'"
          if [ "$helper" != "store" ]; then
            echo "FAIL: expected credential helper 'store'"
            exit 1
          fi
          if [ "$auth" != "basic" ]; then
            echo "FAIL: expected proactiveAuth 'basic'"
            exit 1
          fi
          found=""
          for f in "$HOME/.git-credentials" "${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials"; do
            if [ -f "$f" ]; then
              echo "checking $f (entries, passwords masked):"
              sed -E 's#(://[^:]*:)[^@]*@#\1***@#' "$f"
              if grep -qE '^https://x-access-token:[^@]+@github\.com' "$f"; then
                found="$f"
              fi
            fi
          done
          if [ -z "$found" ]; then
            echo "FAIL: credential store does not contain github.com x-access-token entry"
            exit 1
          fi
          echo "found entry in $found"
          echo "PASS"
      - name: Cleanup
        if: always()
        run: |
          git config --global --unset credential.https://github.com.helper || true
          git config --global --unset http.https://github.com/.proactiveAuth || true
          rm -f "$HOME/.git-credentials"
          rm -f "${XDG_CONFIG_HOME:-$HOME/.config}/git/credentials"
