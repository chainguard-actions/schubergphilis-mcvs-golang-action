name: Test private go modules credential configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token-for-downloading-private-go-modules: dummy-private-modules-token-123
      - name: Assert git credential helper configured
        run: |
          HELPER="$(git config --global --get credential.https://github.com.helper || true)"
          echo "helper: $HELPER"
          if [ "$HELPER" != "store" ]; then
            echo "FAIL: expected credential helper 'store'"
            exit 1
          fi
          AUTH="$(git config --global --get http.https://github.com/.proactiveAuth || true)"
          echo "proactiveAuth: $AUTH"
          if [ "$AUTH" != "basic" ]; then
            echo "FAIL: expected proactiveAuth 'basic'"
            exit 1
          fi
          echo "PASS"
      - name: Assert stored credentials contain the token
        run: |
          CREDS="$(printf 'protocol=https\nhost=github.com\n\n' | GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null || true)"
          echo "$CREDS" | sed 's/^password=.*/password=***/'
          if ! echo "$CREDS" | grep -qx 'username=x-access-token'; then
            echo "FAIL: expected username x-access-token"
            exit 1
          fi
          if ! echo "$CREDS" | grep -qx 'password=dummy-private-modules-token-123'; then
            echo "FAIL: expected stored password to be the provided token"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup credentials
        if: always()
        run: |
          git config --global --unset credential.https://github.com.helper || true
          git config --global --unset http.https://github.com/.proactiveAuth || true
          rm -f ~/.git-credentials
