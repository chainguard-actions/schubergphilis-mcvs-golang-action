name: Test git credentials configured for private go modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert credential helper configured
        run: |
          helper="$(git config --global --get credential.https://github.com.helper || true)"
          echo "helper: $helper"
          if [ "$helper" != "store" ]; then
            echo "FAIL: expected credential helper 'store'"
            exit 1
          fi
          echo "PASS"
      - name: Assert proactive auth configured
        run: |
          auth="$(git config --global --get http.https://github.com/.proactiveAuth || true)"
          echo "proactiveAuth: $auth"
          if [ "$auth" != "basic" ]; then
            echo "FAIL: expected proactiveAuth 'basic'"
            exit 1
          fi
          echo "PASS"
      - name: Assert credential stored
        run: |
          if [ ! -f "$HOME/.git-credentials" ]; then
            echo "FAIL: ~/.git-credentials not found"
            exit 1
          fi
          if ! grep -q 'x-access-token:.*@github.com' "$HOME/.git-credentials"; then
            echo "FAIL: expected x-access-token credential for github.com"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup credentials
        if: always()
        run: |
          rm -f "$HOME/.git-credentials"
          git config --global --unset credential.https://github.com.helper || true
          git config --global --unset http.https://github.com/.proactiveAuth || true
