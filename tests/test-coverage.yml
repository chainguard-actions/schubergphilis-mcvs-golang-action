name: Test coverage testing-type (code-coverage-timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          code-coverage-expected: "80"
          code-coverage-timeout: "5m"
          token: ${{ github.token }}
          go-version-file: "tests/fixtures/go-app/go.mod"
      - name: Assert action ran (coverage may fail due to missing task config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected: task/coverage not configured in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
