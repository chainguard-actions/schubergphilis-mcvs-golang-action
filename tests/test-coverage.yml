name: Test testing-type coverage (covers code-coverage-timeout input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "go.mod"
          testing-type: "coverage"
          token: ${{ github.token }}
          code-coverage-expected: "80"
          code-coverage-timeout: "10m"
      - name: Assert action ran (coverage attempted, may fail due to missing taskfile)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in harness - task remote:coverage requires external taskfile)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
