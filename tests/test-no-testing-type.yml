name: Test no testing-type (all steps skipped)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action succeeded and produced no side effects
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/build/binary" ]; then
            echo "FAIL: no release build expected"
            exit 1
          fi
          if git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null | grep -q 'https://github.com/'; then
            echo "FAIL: unexpected insteadOf git config"
            exit 1
          fi
          echo "PASS"
