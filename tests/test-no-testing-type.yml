name: Test no testing-type (all steps skipped)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action succeeded without building anything
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/build/binary" ] || [ -d "$GITHUB_WORKSPACE/build/zip" ]; then
            echo "FAIL: release build directory unexpectedly created"
            exit 1
          fi
          if git config --global --get credential.https://github.com.helper; then
            echo "FAIL: git credential helper unexpectedly configured"
            exit 1
          fi
          echo "PASS"
