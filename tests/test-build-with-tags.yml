name: Test build binary with release-build-tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-dir: "tests/fixtures/hello"
          release-application-name: "hello"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          release-build-tags: "lambda.norpc"
          go-version-file: "tests/fixtures/hello/go.mod"
      - name: Assert asset_name output includes build tags or action failed gracefully
        env:
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "asset_name: $ASSET_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ASSET_NAME" ]; then
              echo "FAIL: action succeeded but asset_name output is empty"
              exit 1
            fi
            # When release-build-tags is set, the asset name should include the build tags
            if echo "$ASSET_NAME" | grep -q "lambda.norpc"; then
              echo "PASS: asset_name includes build tags: '$ASSET_NAME'"
            else
              echo "FAIL: expected asset_name to include 'lambda.norpc' but got: '$ASSET_NAME'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (e.g. go mod tidy issue in harness workspace)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
