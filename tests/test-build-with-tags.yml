name: Test build binary with release-build-tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "tests/fixtures/go.mod"
          release-dir: "tests/fixtures/cmd/testapp"
          release-application-name: "testapp"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          release-build-tags: "integration"
      - name: Assert binary built with tags or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          BINARY_PATH="$GITHUB_WORKSPACE/build/binary/testapp/amd64/main"
          if [ "$OUTCOME" = "success" ]; then
            if [ -f "$BINARY_PATH" ]; then
              echo "PASS: binary exists at $BINARY_PATH (built with release-build-tags)"
              file "$BINARY_PATH"
            else
              echo "FAIL: action succeeded but binary not found at $BINARY_PATH"
              find "$GITHUB_WORKSPACE/build" -type f 2>/dev/null || echo "(build dir not found)"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (e.g. Go version not available or go mod tidy issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
