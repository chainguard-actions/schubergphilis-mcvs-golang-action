name: Test code-coverage-timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with coverage testing-type and code-coverage-timeout
        id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: coverage
          code-coverage-timeout: 5m
          code-coverage-expected: "80"
          token: ${{ github.token }}
      - name: Assert action ran with code-coverage-timeout input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (no real Go project in workspace)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
