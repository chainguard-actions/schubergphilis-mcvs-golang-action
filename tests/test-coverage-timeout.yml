name: Test coverage with code-coverage-timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "coverage"
          code-coverage-expected: "80"
          code-coverage-timeout: "10m"
          token: ${{ github.token }}
          # testing-type=coverage triggers: setup-go, install-task, go-mod-tidy, code coverage
          # The coverage step runs 'task remote:coverage --yes' which will fail without
          # a full project setup, but we verify the inputs were accepted.
      - name: Assert action ran with coverage-timeout input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: coverage completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: coverage failed gracefully (expected without full project setup)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
