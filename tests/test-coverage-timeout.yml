name: Test coverage testing-type with code-coverage-timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake task binary that succeeds for coverage
        run: |
          cat > /usr/local/bin/task << 'EOF'
          #!/bin/sh
          # Fake task: report version and succeed for any remote:* command
          case "$1" in
            --version)
              echo "Task version: v3.51.1"
              ;;
            *)
              echo "Fake task: running $*"
              exit 0
              ;;
          esac
          EOF
          chmod +x /usr/local/bin/task
          echo "Fake task installed: $(task --version)"
      - id: action
        uses: .
        with:
          go-version-file: "go.mod"
          testing-type: "coverage"
          code-coverage-expected: "80"
          code-coverage-timeout: "10m"
          token: ${{ github.token }}
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with testing-type=coverage and code-coverage-timeout input"
