name: Test github-token-for-downloading-private-go-modules input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version-file: "go.mod"
          github-token-for-downloading-private-go-modules: ${{ github.token }}
          release-dir: "tests/fixtures/cmd/hello"
          release-application-name: "hello"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          release-build-tags: "mytag"
      - name: Assert binary was built after private modules token was configured
        run: |
          BINARY_PATH="build/binary/hello/amd64/main"
          echo "Checking for binary at: $BINARY_PATH"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "FAIL: binary not found at $BINARY_PATH"
            find build/ -type f 2>/dev/null || echo "build/ directory not found"
            exit 1
          fi
          echo "PASS: binary exists at $BINARY_PATH (private modules token was accepted)"
