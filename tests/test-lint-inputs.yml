name: Test lint inputs (build-tags and golangci-timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "lint"
          build-tags: "integration"
          golangci-timeout: "5m"
          # go-version-file defaults to go.mod which exists in the action repo root
      - name: Assert action ran (lint may fail on harness repo, but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: lint succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: lint failed gracefully (expected on harness repo without golangci config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
