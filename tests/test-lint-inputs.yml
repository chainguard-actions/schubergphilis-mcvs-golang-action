name: Test lint inputs (build-tags, golangci-timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with lint testing-type and lint-specific inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: lint
          build-tags: component
          golangci-timeout: 5m
          token: ${{ github.token }}
      - name: Assert action ran with lint inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: lint completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: lint ran and failed gracefully (no real Go project in workspace)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
