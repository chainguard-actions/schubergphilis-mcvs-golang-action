name: Test lint inputs (testing-type, token, golangci-timeout, build-tags)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake task binary matching expected version
        run: |
          # Create a fake task binary so the action's version check passes
          printf '#!/bin/sh\necho "Task version: v3.51.1"\n' > /usr/local/bin/task
          chmod +x /usr/local/bin/task
          echo "Fake task installed: $(task --version)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "go.mod"
          testing-type: "lint"
          token: ${{ github.token }}
          golangci-timeout: "5m"
          build-tags: "integration"
      - name: Assert action ran (lint testing-type with golangci-timeout and build-tags)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because task remote:golangci-lint is not
          # available in this test environment, but it must have run (not skipped).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with testing-type=lint, golangci-timeout, build-tags, and token inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have been skipped"
            exit 1
          fi
