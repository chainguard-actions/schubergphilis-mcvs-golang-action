name: Test no-op (no testing-type, no release-dir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No testing-type, no release-dir, task-install defaults to "no".
        # All conditional steps are skipped; the action completes successfully.
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error in no-op mode"
