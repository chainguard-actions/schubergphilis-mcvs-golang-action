name: Test no-op (no testing-type, no release-dir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Explicitly set task-install to 'no' (the default) so that
          # setup-go and install-task steps are skipped.
          # No testing-type, no release-dir: all conditional steps are skipped.
          # The action should complete successfully with no work done.
          task-install: "no"
      - name: Assert action completed without error
        run: |
          echo "PASS: action completed successfully with no testing-type and no release-dir"
