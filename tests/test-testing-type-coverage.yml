name: Test testing-type coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake task binary to avoid network dependency
        run: |
          cat > /usr/local/bin/task << 'EOF'
          #!/bin/sh
          echo "Task version: v3.53.1"
          case "$*" in
            *coverage*)
              echo "Fake coverage run (mocked)"
              exit 0
              ;;
          esac
          echo "Task called with: $*"
          exit 0
          EOF
          chmod +x /usr/local/bin/task
          echo "Fake task installed"
          task --version
      - name: Patch workspace go.mod to a valid Go version and commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          sed -i 's/^go .*/go 1.21.0/' go.mod
          if git diff --quiet; then
            echo "go.mod already at target version"
          else
            git add go.mod
            git commit -m "patch go.mod version for test"
            echo "Committed go.mod version patch"
          fi
      - name: Run action with testing-type coverage
        id: action
        uses: .
        with:
          go-version-file: "tests/fixtures/goapp/go.mod"
          testing-type: "coverage"
          code-coverage-expected: "80"
          code-coverage-timeout: "5m"
          token: ${{ github.token }}
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with testing-type=coverage and code-coverage-timeout input"
