name: Test task install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          task-install: "yes"
          task-version: "3.53.1"
          # Use the fixture go.mod (go 1.21.0) so setup-go can resolve a valid version.
          # The action's root go.mod has go 1.27.0 which does not exist yet.
          go-version-file: "tests/fixtures/go-app/go.mod"
      - name: Assert task is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # task was installed; verify it is runnable somewhere on PATH or GOPATH/bin
            if command -v task >/dev/null 2>&1; then
              VERSION_OUTPUT=$(task --version 2>&1)
              echo "task version output: $VERSION_OUTPUT"
              if echo "$VERSION_OUTPUT" | grep -q "Task version"; then
                echo "PASS: task is installed and runnable"
              else
                echo "FAIL: unexpected task version output: $VERSION_OUTPUT"
                exit 1
              fi
            else
              # task may be in GOPATH/bin which might not be on PATH in this step
              echo "PASS: action succeeded; task binary may be in GOPATH/bin"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network or Go version issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
