name: Test task-install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          task-install: "yes"
          task-version: "3.53.1"
          go-version-file: "tests/fixtures/go.mod"
      - name: Assert task is installed or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # task may be in GOBIN or go/bin
            GOPATH_BIN="$(go env GOPATH 2>/dev/null)/bin"
            export PATH="$PATH:$GOPATH_BIN"
            if task --version 2>/dev/null | grep -q "Task version: v3.53.1"; then
              echo "PASS: task v3.53.1 is installed"
            else
              echo "FAIL: action succeeded but task v3.53.1 not found or wrong version"
              task --version 2>/dev/null || echo "(task not found in PATH)"
              echo "PATH=$PATH"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (e.g. Go version not available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
