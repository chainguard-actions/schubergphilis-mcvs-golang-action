name: Test task-install installs Go and Task
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          task-install: "yes"
          task-version: "3.53.1"
          # go-version-file defaults to go.mod which exists in the action repo root
      - name: Assert task is installed and runnable
        run: |
          echo "Checking task binary..."
          if ! command -v task &>/dev/null; then
            echo "FAIL: task binary not found in PATH"
            exit 1
          fi
          TASK_VER=$(task --version 2>&1)
          echo "task version: $TASK_VER"
          if ! echo "$TASK_VER" | grep -q "3.53.1"; then
            echo "FAIL: expected task version 3.53.1, got: $TASK_VER"
            exit 1
          fi
          echo "PASS: task is installed with correct version"
