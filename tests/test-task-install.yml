name: Test task install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with task-install=yes
        id: action
        uses: .
        with:
          task-install: "yes"
          task-version: "3.43.3"
          # go-version-file defaults to go.mod which exists in the repo root
      - name: Assert task is installed and runnable
        run: |
          echo "Checking task binary..."
          if ! command -v task &>/dev/null && ! [ -f "$HOME/go/bin/task" ]; then
            echo "FAIL: task binary not found"
            exit 1
          fi
          # Try running task --version
          TASK_BIN="task"
          if ! command -v task &>/dev/null; then
            TASK_BIN="$HOME/go/bin/task"
          fi
          VERSION=$("$TASK_BIN" --version 2>&1)
          echo "task version: $VERSION"
          if echo "$VERSION" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "PASS: task is installed and reports a version"
          else
            echo "FAIL: task version output unexpected: $VERSION"
            exit 1
          fi
