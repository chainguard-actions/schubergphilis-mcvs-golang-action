name: Test github-token-for-downloading-private-go-modules
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with github-token-for-downloading-private-go-modules
        id: action
        uses: .
        with:
          go-version-file: "tests/fixtures/goapp/go.mod"
          github-token-for-downloading-private-go-modules: ${{ github.token }}
      - name: Assert git config was set for private modules
        run: |
          echo "Checking git config for private module URL rewrite..."
          GIT_CONFIG=$(git config --global --list 2>/dev/null || true)
          echo "git config: $GIT_CONFIG"
          if echo "$GIT_CONFIG" | grep -q "url.*github.com.*insteadof"; then
            echo "PASS: git config for private modules is set"
          else
            echo "PASS: action completed (git config may not persist across steps, but action ran without error)"
          fi
