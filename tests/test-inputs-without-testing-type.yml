name: Test optional inputs are accepted when no testing-type triggers work
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          build-tags: component
          golangci-timeout: "5"
          test-timeout: 10m
          code-coverage-timeout: 15m
          grype-version: v0.87.0
          token: ${{ github.token }}
          gta-partial-testing: "false"
      - name: Assert action succeeded without running any tooling
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/build/binary" ]; then
            echo "FAIL: no release build expected"
            exit 1
          fi
          echo "PASS"
