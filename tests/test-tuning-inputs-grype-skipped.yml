name: Test tuning inputs accepted when grype is skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          testing-type: security-grype
          grype-version: v0.87.0
          build-tags: component
          golangci-timeout: "10"
          test-timeout: 5m
          code-coverage-timeout: 5m
      - name: Assert action succeeded without running anything
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/build/binary" ]; then
            echo "FAIL: unexpected release build output"
            exit 1
          fi
          if git config --global --get credential.https://github.com.helper >/dev/null 2>&1; then
            echo "FAIL: credential helper unexpectedly configured"
            exit 1
          fi
          echo "PASS"
