name: Test integration testing-type with test-timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: "integration"
          token: ${{ github.token }}
          test-timeout: "10m"
          go-version-file: "tests/fixtures/hello/go.mod"
      - name: Assert action ran with integration inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with integration inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness - no Taskfile)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
