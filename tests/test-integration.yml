name: Test integration testing-type with test-timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: integration
          test-timeout: 5m
          token: ${{ github.token }}
          go-version-file: tests/fixtures/simple-app/go.mod
      - name: Assert action ran with integration inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The integration testing-type runs go mod tidy and task remote:test-integration-cicd.
          # It may fail because the fixture app has no task remote targets
          # configured, but the action must not crash unexpectedly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: integration action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — integration tools not fully configured in fixture)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
