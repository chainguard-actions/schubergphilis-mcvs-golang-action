name: Test grype security scanning inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with security-grype testing-type
        id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: security-grype
          grype-version: "0.88.0"
          token: ${{ github.token }}
          go-version-file: tests/fixtures/app/go.mod
      - name: Assert action ran with grype inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: ${OUTCOME}"
          # The grype step uses anchore/scan-action which downloads and runs grype.
          # In the test environment it may succeed or fail depending on network access
          # and the scan results. What we verify is that the action ran (not skipped)
          # and that the inputs were accepted.
          if [ "${OUTCOME}" = "success" ]; then
            echo "PASS: grype scan succeeded"
          elif [ "${OUTCOME}" = "failure" ]; then
            echo "PASS: grype scan failed gracefully (expected in test environment)"
          else
            echo "FAIL: unexpected outcome '${OUTCOME}'"
            exit 1
          fi
