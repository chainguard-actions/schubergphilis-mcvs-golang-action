name: Test unknown testing-type is a no-op
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          testing-type: does-not-exist
          gta-partial-testing: "false"
      - name: Assert action succeeded and workspace unchanged
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "FAIL: go.mod/go.sum should not be modified"
            git status --porcelain
            exit 1
          fi
          echo "PASS"
