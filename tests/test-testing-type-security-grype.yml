name: Test testing-type security-grype
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with testing-type security-grype
        id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "tests/fixtures/goapp/go.mod"
          testing-type: "security-grype"
          grype-version: "0.88.0"
          token: ${{ github.token }}
      - name: Assert action ran (grype scan or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: grype scan completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
