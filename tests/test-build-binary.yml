name: Test build binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          release-dir: "tests/fixtures/simple-app"
          release-application-name: "myapp"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          go-version-file: "go.mod"
      - name: Assert binary was built
        run: |
          BINARY_PATH="build/binary/myapp/amd64/main"
          echo "Checking for binary at: $BINARY_PATH"
          if [ ! -f "$BINARY_PATH" ]; then
            echo "FAIL: binary not found at $BINARY_PATH"
            ls -la build/ 2>/dev/null || echo "build/ directory does not exist"
            exit 1
          fi
          echo "PASS: binary found at $BINARY_PATH"
      - name: Assert asset_name output is set
        env:
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
        run: |
          echo "asset_name: $ASSET_NAME"
          if [ -z "$ASSET_NAME" ]; then
            echo "FAIL: asset_name output is empty"
            exit 1
          fi
          # Should contain the app name
          if echo "$ASSET_NAME" | grep -q "myapp"; then
            echo "PASS: asset_name contains app name: $ASSET_NAME"
          else
            echo "FAIL: asset_name does not contain 'myapp': $ASSET_NAME"
            exit 1
          fi
