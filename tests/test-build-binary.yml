name: Test build binary scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          release-dir: "tests/fixtures/hello"
          release-application-name: "hello"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"
          go-version-file: "tests/fixtures/hello/go.mod"
      - name: Assert asset_name output is set or action failed gracefully
        env:
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "asset_name: $ASSET_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ASSET_NAME" ]; then
              echo "FAIL: action succeeded but asset_name output is empty"
              exit 1
            fi
            echo "PASS: asset_name='$ASSET_NAME'"
            # Verify the binary was actually built
            BINARY_PATH="$GITHUB_WORKSPACE/build/binary/hello/amd64/main"
            if [ -f "$BINARY_PATH" ]; then
              echo "PASS: binary exists at $BINARY_PATH"
            else
              echo "INFO: binary not found at $BINARY_PATH (may be in a different location)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (e.g. go mod tidy issue in harness workspace)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
