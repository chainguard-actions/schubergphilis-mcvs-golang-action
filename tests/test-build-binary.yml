name: Test build binary
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "tests/fixtures/hello/go.mod"
          release-dir: "tests/fixtures/hello"
          release-application-name: "hello"
          release-architecture: "amd64"
          release-os: "linux"
          release-type: "binary"

      - name: Assert binary built or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          BINARY_PATH="$GITHUB_WORKSPACE/build/binary/hello/amd64/main"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded. Checking binary..."
            if [ ! -f "$BINARY_PATH" ]; then
              echo "FAIL: action succeeded but binary not found at $BINARY_PATH"
              ls -la "$GITHUB_WORKSPACE/build/" 2>/dev/null || echo "build dir does not exist"
              exit 1
            fi
            OUTPUT=$("$BINARY_PATH" 2>&1 || true)
            echo "Binary output: $OUTPUT"
            echo "PASS: binary built successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (go mod tidy or Go version issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
