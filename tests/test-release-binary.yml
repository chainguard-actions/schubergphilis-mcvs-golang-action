name: Test release binary build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake task binary to avoid network dependency
        run: |
          cat > /usr/local/bin/task << 'EOF'
          #!/bin/sh
          echo "Task version: v3.53.1"
          exit 0
          EOF
          chmod +x /usr/local/bin/task
      - name: Patch workspace go.mod to a valid Go version and commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          sed -i 's/^go .*/go 1.21.0/' go.mod
          if git diff --quiet; then
            echo "go.mod already at target version"
          else
            git add go.mod
            git commit -m "patch go.mod version for test"
            echo "Committed go.mod version patch"
          fi
      - name: Run action to build a binary
        id: action
        uses: .
        with:
          go-version-file: "tests/fixtures/goapp/go.mod"
          release-dir: "tests/fixtures/goapp"
          release-application-name: "testapp"
          release-architecture: "amd64"
          release-type: "binary"
          release-build-tags: ""
          token: ${{ github.token }}
      - name: Assert binary was built
        run: |
          BINARY="build/binary/testapp/amd64/main"
          echo "Checking for binary at: $BINARY"
          if [ ! -f "$BINARY" ]; then
            echo "FAIL: expected binary not found at $BINARY"
            exit 1
          fi
          echo "PASS: binary exists at $BINARY"
      - name: Assert asset_name output is set
        env:
          ASSET_NAME: ${{ steps.action.outputs.asset_name }}
        run: |
          echo "asset_name: $ASSET_NAME"
          if [ -z "$ASSET_NAME" ]; then
            echo "FAIL: asset_name output is empty"
            exit 1
          fi
          if ! echo "$ASSET_NAME" | grep -q "testapp"; then
            echo "FAIL: asset_name does not contain 'testapp', got: $ASSET_NAME"
            exit 1
          fi
          echo "PASS: asset_name is set to '$ASSET_NAME'"
