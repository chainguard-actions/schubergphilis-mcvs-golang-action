name: Test security-grype with explicit grype-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with security-grype and explicit grype-version
        id: action
        uses: .
        continue-on-error: true
        with:
          testing-type: security-grype
          token: ${{ github.token }}
          grype-version: v0.88.0
      - name: Assert action ran with grype-version input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: grype scan completed successfully with explicit version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: grype scan ran and failed gracefully (findings or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
