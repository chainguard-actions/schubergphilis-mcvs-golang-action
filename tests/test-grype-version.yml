name: Test grype-version and token inputs with security-grype testing-type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          go-version-file: "go.mod"
          testing-type: "security-grype"
          grype-version: "v0.88.0"
          token: ${{ github.token }}
      - name: Assert action ran with grype-version and token inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: security-grype scan completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with grype-version and token inputs (scan may have found issues or failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
