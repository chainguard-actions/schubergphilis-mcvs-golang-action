name: Test no testing-type (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action succeeded without doing anything
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/build" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE/build" | grep -v '^task.yml$' || true)" ]; then
            ls -la "$GITHUB_WORKSPACE/build"
          fi
          if git config --global --get credential.https://github.com.helper >/dev/null 2>&1; then
            echo "FAIL: credential helper should not be configured"
            exit 1
          fi
          echo "PASS"
