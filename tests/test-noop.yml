name: Test no-op (no testing-type, no release-dir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No testing-type or release-dir means all conditional steps are skipped.
        # Provide go-version-file pointing to a valid fixture to avoid any
        # potential issues with the default go.mod (which has go 1.27.1),
        # even though setup-go is also skipped for this scenario.
        with:
          go-version-file: "tests/fixtures/go-project/go.mod"
      - name: Assert action completed without error
        run: |
          echo "PASS: action completed successfully with no testing-type (all steps skipped)"
