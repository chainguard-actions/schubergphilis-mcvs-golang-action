name: Test no-op scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no testing-type and no release-dir
        id: action
        uses: .
        with:
          # No testing-type, no release-dir — all conditional steps are skipped.
          # go-version-file is set to a valid file even though setup-go is skipped,
          # to avoid any potential issues with the default go.mod not existing.
          go-version-file: tests/fixtures/app/go.mod
      - name: Assert action completed successfully
        run: |
          echo "Action completed without errors — PASS"
          echo "All conditional steps were skipped as expected"
