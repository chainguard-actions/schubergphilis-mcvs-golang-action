name: Test no-op (no testing-type, no release-dir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no testing-type or release-dir
        id: action
        uses: .
        # No testing-type, no release-dir — all major steps should be skipped
      - name: Assert action completed without error
        run: |
          echo "PASS: action completed without error in no-op mode"
