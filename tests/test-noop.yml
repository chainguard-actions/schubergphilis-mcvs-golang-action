name: Test no-op (no testing-type, no release-dir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        # No testing-type, no release-dir — all conditional steps are skipped
      - name: Assert action completed without error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no testing-type and no release-dir"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (all steps should have been skipped)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
