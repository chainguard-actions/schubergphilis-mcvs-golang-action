name: Test no-op (no inputs trigger any steps)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no triggering inputs
        id: action
        uses: .
        # No inputs set: testing-type is empty, release-dir is empty,
        # task-install defaults to 'no' — all conditional steps are skipped.
      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed with no steps triggered"
